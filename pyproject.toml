[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocut"
version = "0.1.0"
description = "AI rough-cut and reference analysis for Premiere Pro (FCP7 XML)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
whisperx = ["whisperx>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
autocut = "autocut.cli:main"

[tool.setuptools.packages.find]
include = ["autocut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
