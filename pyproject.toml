[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocut"
version = "0.1.0"
description = "AI rough-cut and reference analysis for Premiere Pro (FCP7 XML)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
whisperx = ["whisperx>=3.1"]
mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# 윈도우/리눅스 NVIDIA GPU용 CUDA 12 런타임 (드라이버만 있으면 CUDA Toolkit 별도 설치 불필요)
cuda = [
  "nvidia-cublas-cu12; sys_platform != 'darwin'",
  "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
]
dev = ["pytest>=8"]

[project.scripts]
autocut = "autocut.cli:main"

[tool.setuptools.packages.find]
include = ["autocut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
